<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turing - Questions, Answers</title>
  <meta name="description" content="Chat with Turing — precise reasoning, real memory and direct answers.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0A0A'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F5F5F5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ia.css?v=3">
  <link rel="stylesheet" href="/veil.css?v=1">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- arrival/departure loading veil (starts covering the page) -->
  <div class="transition active" id="veil" aria-hidden="true">
    <div class="transition-inner">
      <div class="transition-word"><span style="--d:.04s">T</span><span style="--d:.09s">u</span><span style="--d:.14s">r</span><span style="--d:.19s">i</span><span style="--d:.24s">n</span><span style="--d:.29s">g</span></div>
      <div class="transition-line"></div>
      <div class="transition-loader" role="status"><i></i></div>
    </div>
  </div>

  <div class="ia-shell" id="iaShell" hidden>
    <!-- ======= sidebar ======= -->
    <aside class="ia-side" id="iaSide" aria-label="Conversations">
      <div class="side-top">
        <button class="new-chat" id="newChatBtn">
          <span class="nc-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
          <span data-i18n="iaNew">New chat</span>
        </button>
      </div>
      <div class="side-label" data-i18n="iaChats">Chats</div>
      <div class="side-list" id="chatList"></div>
      <div class="side-bottom">
        <a class="side-link" href="/account.html" id="accountLink" data-veil>
          <span class="avatar" id="sideAva">·</span>
          <span class="sl-name" id="sideName"></span>
          <svg class="sl-gear" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        </a>
      </div>
    </aside>

    <!-- ======= main ======= -->
    <div class="ia-main">
      <header class="ia-top">
        <button class="ia-burger" id="sideBtn" aria-label="Menu"><span></span><span></span></button>
        <a class="wordmark" href="/" data-veil>Turing</a>
        <span class="top-divider" aria-hidden="true"></span>
        <span class="top-model" id="topModel">Turing AI</span>
        <div class="ia-top-right">
          <div class="lang" id="langSwitch">
            <button class="lang-btn" id="langBtn" aria-expanded="false"><span id="langGlobe"></span><span class="lang-cur" id="langCur">EN</span></button>
            <div class="lang-menu" id="langMenu" hidden></div>
          </div>
          <a class="top-avatar" id="topAva" href="/account.html" data-veil><span class="avatar" id="topAvaLetter">·</span></a>
        </div>
      </header>

      <div class="ia-body" id="iaBody"></div>

      <div class="ia-composer-wrap">
        <div class="composer" id="composer">
          <textarea id="msgInput" rows="1" maxlength="6000" autocomplete="off"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send">
            <svg class="ic-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <span class="ic-stop" aria-hidden="true"></span>
          </button>
        </div>
        <div class="composer-note" data-i18n="iaDisclaimer">Turing can make mistakes. Check important information.</div>
      </div>
    </div>
  </div>

  <div class="ia-scrim" id="scrim" hidden></div>

  <!-- limit-reached modal (deliberately shows no numbers) -->
  <div class="modal" id="limitModal" hidden>
    <div class="modal-card">
      <div class="m-ic" aria-hidden="true"><span class="m-ring"></span>⏳</div>
      <h3 data-i18n="iaErrLimitT">Message limit reached</h3>
      <p data-i18n="iaErrLimit">You have used all your messages for now. Take a breath — you can continue a bit later.</p>
      <div class="m-btns">
        <a class="btn btn-ghost" href="/account.html" data-i18n="accHead" data-veil>Account</a>
        <button class="btn btn-dark" id="limitClose">OK</button>
      </div>
    </div>
  </div>

  <script src="/i18n.js?v=12"></script>
  <script src="/veil.js?v=1"></script>
  <script src="/ia.js?v=3"></script>
</body>
</html>
