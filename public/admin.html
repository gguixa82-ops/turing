<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turing Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0A'/%3E%3Ctext x='32' y='18' text-anchor='middle' font-family='Inter,Arial,Helvetica,sans-serif' font-size='12' font-weight='700' fill='%23F5F5F5'%3ETuring%3C/text%3E%3Ctext x='32' y='29' text-anchor='middle' font-family='Inter,Arial,Helvetica,sans-serif' font-size='6.2' font-weight='500' fill='%23B8B8BE'%3EQuestions, Answers%3C/text%3E%3Ccircle cx='32' cy='46' r='9' fill='%23F5F5F5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css?v=11">
  <link rel="stylesheet" href="/veil.css?v=3">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="veil on" id="veil" aria-hidden="true">
    <div class="veil-inner">
      <div class="veil-word">Turing</div>
      <div class="veil-bar"><i></i></div>
    </div>
  </div>

  <!-- login -->
  <div class="a-login" id="loginView" hidden>
    <div class="a-login-bg" aria-hidden="true"><div class="l-glow"></div></div>
    <div class="a-login-card">
      <div class="a-logo">Turing</div>
      <div class="a-login-eyebrow">Control room</div>
      <h1>Admin access</h1>
      <p class="a-login-sub">Sign in to manage status, support and site controls.</p>
      <form id="aLoginForm">
        <div class="field"><label for="aUser">Username</label><input id="aUser" type="text" autocomplete="username" placeholder="username"></div>
        <div class="field"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <div id="aLoginErr" class="form-err" hidden></div>
        <button class="btn btn-primary" type="submit" style="width:100%">Enter <span class="arr">→</span></button>
      </form>
    </div>
  </div>

  <!-- app -->
  <div class="a-app" id="appView" hidden>
    <aside class="a-side">
      <a class="a-brand" href="/admin1042024">Turing <span>Admin</span></a>
      <nav class="a-nav" id="aNav">
        <button data-sec="overview" class="active"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5"/></svg>Overview</button>
        <button data-sec="support"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="3" width="13" height="10" rx="2"/><path d="M2 4l6 4.5L14 4"/></svg>Support<span class="a-badge" id="supBadge" hidden>0</span></button>
        <button data-sec="users"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="5.5" r="2.6"/><path d="M1.5 13.5c.6-2.4 2.4-3.6 4.5-3.6s3.9 1.2 4.5 3.6"/><circle cx="11.8" cy="6" r="2" opacity=".55"/><path d="M11.5 10.1c1.8.2 3 1.3 3.4 3.4" opacity=".55"/></svg>Users</button>
        <button data-sec="status"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 12.5l3.5-4 3 2.5 4.5-6 2 1.5"/><path d="M1.5 14.5h13" opacity=".4"/></svg>Status</button>
        <button data-sec="ai"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5l1.4 3.6L13 6.5l-3.6 1.4L8 11.5 6.6 7.9 3 6.5l3.6-1.4L8 1.5z"/><path d="M12.5 10.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z" opacity=".7"/></svg>AI</button>
        <button data-sec="site"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 4.5h8M12.5 4.5h2M1.5 11.5h2M6.5 11.5h8"/><circle cx="10.5" cy="4.5" r="2"/><circle cx="4.5" cy="11.5" r="2"/></svg>Site controls</button>
      </nav>
      <div class="a-side-foot">
        <div class="a-user"><span class="a-avatar">G</span><div><div class="a-uname">genisguixa</div><div class="a-urole">administrator</div></div></div>
        <button class="a-logout" id="logoutBtn">Sign out</button>
      </div>
    </aside>
    <main class="a-main" id="aMain"></main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/veil.js?v=4"></script>
  <script src="/admin.js?v=12"></script>
</body>
</html>
